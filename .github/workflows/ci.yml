name: CI

# 每次推送与 PR：完整验证（类型、单元/集成、真实 Electron 桌面流程）
on:
  push:
    branches: [main]
  pull_request:

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache (bun + electron 二进制)
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/Library/Caches/electron
          key: mac-ci-${{ hashFiles('bun.lock') }}

      - name: 安装依赖（含 Electron 二进制）
        run: bun install --frozen-lockfile

      - name: 类型检查
        run: bun run typecheck

      - name: 单元与集成测试（临时 Git 仓库 fixture）
        run: bun run test

      - name: Electron 桌面端到端
        run: bun run test:e2e

      - name: 上传测试失败现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
