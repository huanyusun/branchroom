name: Build macOS app

# 手动触发或打 tag（v*）：打包 .app（arm64 + x64），验证后作为产物上传；
# 打 tag 时同时创建 GitHub Release，供其他电脑直接下载。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      # 本机构建未配置证书：CI 跳过签名，产出未签名的本地构建
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache (bun + electron 二进制)
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/Library/Caches/electron
          key: mac-ci-${{ hashFiles('bun.lock') }}

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 构建 renderer/main/preload
        run: bun run build

      - name: 打包 arm64 与 x64
        run: |
          bunx electron-builder --mac --dir --arm64
          bunx electron-builder --mac --dir --x64

      - name: 打包产物真实启动验证（强制，不跳过）
        run: bun run test:e2e --grep 打包产物
        env:
          BRANCHROOM_REQUIRED_PACKAGED: '1'

      - name: 归档 arm64
        run: cd dist/mac-arm64 && zip -qry ../Branchroom-mac-arm64.zip Branchroom.app

      - name: 归档 x64
        run: cd dist/mac && zip -qry ../Branchroom-mac-x64.zip Branchroom.app

      - name: 上传产物（Actions 页面可下载）
        uses: actions/upload-artifact@v4
        with:
          name: Branchroom-macos-${{ github.sha }}
          path: |
            dist/Branchroom-mac-arm64.zip
            dist/Branchroom-mac-x64.zip
          if-no-files-found: error

      - name: 发布 Release（仅 tag 推送）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Branchroom-mac-arm64.zip \
            dist/Branchroom-mac-x64.zip \
            --generate-notes
